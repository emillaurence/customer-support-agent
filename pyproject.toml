[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Bookly conversational AI customer support agent"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "neo4j>=5.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs against a real, seeded Neo4j database. Skipped when it is unreachable. Select with `pytest -m integration`.",
]
